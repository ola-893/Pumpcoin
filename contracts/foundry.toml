[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# Required: vault configuration/period accounting exceeds legacy codegen stack
# limits; via-IR preserves behavior while fitting the frames.
via_ir = true
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 110
